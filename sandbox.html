<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Merge sandbox</title></head>
<body>
<!-- The UMD core has no browser-global branch; capture its factory via a
     temporary CommonJS shim while the script loads. -->
<script>window.module = { exports: {} }; window.exports = window.module.exports;</script>
<script src="https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js"></script>
<script>
  window.createFFmpegCore = window.module.exports;
  delete window.module;
  delete window.exports;
</script>
<script src="shared.js"></script>
<script src="sandbox.js"></script>
</body>
</html>
